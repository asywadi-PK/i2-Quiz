      setupPositionProbePattern(_moduleCount - 7, 0);

          } else {

          }

      var pattern = 0;

      for (var i = 0; i < 8; i += 1) {

        makeImpl(true, i);

        var lostPoint = QRUtil.getLostPoint(_this);

        if (i == 0 || minLostPoint > lostPoint) {

          pattern = i;

      for (var r = 8; r < _moduleCount - 8; r += 1) {
        if (_modules[r][6] != null) {
          continue;
        }
        _modules[r][6] = (r % 2 == 0);

      for (var c = 8; c < _moduleCount - 8; c += 1) {
        if (_modules[6][c] != null) {
          continue;

        _modules[6][c] = (c % 2 == 0);

    var setupPositionAdjustPattern = function() {

      var pos = QRUtil.getPatternPosition(_typeNumber);

      for (var i = 0; i < pos.length; i += 1) {

        for (var j = 0; j < pos.length; j += 1) {

          var row = pos[i];
          var col = pos[j];

          if (_modules[row][col] != null) {
            continue;
          }

          for (var r = -2; r <= 2; r += 1) {

            for (var c = -2; c <= 2; c += 1) {

      var bits = QRUtil.getBCHTypeInfo(data);

      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 6) {
          _modules[i][8] = mod;
        } else if (i < 8) {
          _modules[i + 1][8] = mod;
        } else {
          _modules[_moduleCount - 15 + i][8] = mod;
        }
      }

      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        } else if (i < 9) {

        } else {

      var row = _moduleCount - 1;

              bitIndex -= 1;

              if (bitIndex == -1) {
                byteIndex += 1;
                bitIndex = 7;

          if (row < 0 || _moduleCount <= row) {
            row -= inc;
            inc = -inc;
            break;
          }

      var max = size - margin;

      return createDataURL(size, size, function(x, y) {

      img += '"';
      img += '\u0020width="';

      img += '"';
      img += '\u0020height="';
      img += size;
      img += '"';
      if (alt) {

        img += escapeXml(alt);
        img += '"';
      }
      img += '/>';

      return img;
    };

        switch(c) {

      margin = (typeof margin == 'undefined')? cellSize * 2 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      var y, x, r1, r2, p;

      var blocks = {

        '█ ': '▀',
        ' █': '▄',
        '  ': ' '

      var blocksLastLineNoMargin = {
        '██': '▀',
        '█ ': '▀',
        ' █': ' ',
        '  ': ' '

      var ascii = '';

        r2 = Math.floor((y + 1 - min) / cellSize);

          ascii += (margin < 1 && y+1 >= max) ? blocksLastLineNoMargin[p] : blocks[p];

      return ascii.substring(0, ascii.length-1);

    _this.createASCII = function(cellSize, margin) {

      if (cellSize < 2) {
        return _createHalfASCII(margin);

      cellSize -= 1;
      margin = (typeof margin == 'undefined')? cellSize * 2 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      var y, x, r, p;

      var white = Array(cellSize+1).join('██');
      var black = Array(cellSize+1).join('  ');

      var ascii = '';
      var line = '';
      for (y = 0; y < size; y += 1) {
        r = Math.floor( (y - min) / cellSize);
        line = '';
        for (x = 0; x < size; x += 1) {
          p = 1;

        }

      cellSize = cellSize || 2;
      var length = _this.getModuleCount();

  qrcode.createStringToBytes = function(unicodeData, numChars) {

    // create conversion map.

    var unicodeMap = function() {

      var bin = base64DecodeInputStream(unicodeData);
      var read = function() {
        var b = bin.read();
        if (b == -1) throw 'eof';
        return b;
      };

      var count = 0;
      var unicodeMap = {};
      while (true) {
        var b0 = bin.read();
        if (b0 == -1) break;
        var b1 = read();
        var b2 = read();
        var b3 = read();
        var k = String.fromCharCode( (b0 << 8) | b1);
        var v = (b2 << 8) | b3;
        unicodeMap[k] = v;
        count += 1;
      }
      if (count != numChars) {
        throw count + ' != ' + numChars;
      }

      return unicodeMap;
    }();

    var unknownChar = '?'.charCodeAt(0);

    return function(s) {
      var bytes = [];
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charCodeAt(i);
        if (c < 128) {
          bytes.push(c);
        } else {
          var b = unicodeMap[s.charAt(i)];
          if (typeof b == 'number') {
            if ( (b & 0xff) == b) {
              // 1byte
              bytes.push(b);
            } else {

              bytes.push(b & 0xff);
            }
          } else {
            bytes.push(unknownChar);
          }
        }
      }
      return bytes;
    };

<style>
:root{--ink:#141B2B;--ink2:#1F2840;--paper:#F2EFE8;--amber:#FFB547;--muted:#B7BDCB;--a:#E4572E;--b:#2F7DD1;--c:#E8A317;--d:#2E9E6A}

body{background:radial-gradient(1200px 700px at 15% -10%,#2B3A63 0,transparent 60%),radial-gradient(900px 600px at 110% 110%,#4A2E1A 0,transparent 55%),var(--ink);background-attachment:fixed}

.btn:active{transform:translateY(4px);box-shadow:0 2px 0 #B97A1C}
.btn:disabled{opacity:.4;cursor:default}
.btn.ghost{background:rgba(255,255,255,.08);color:var(--paper);box-shadow:none}
.hint{color:var(--muted);font-size:15px}
.fade-in{animation:fin .45s ease both}
@keyframes fin{from{opacity:0;transform:translateY(18px)}}
@keyframes pop{0%{transform:scale(.4);opacity:0}70%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}

.top{display:flex;justify-content:space-between;align-items:center;padding-right:250px;min-height:44px}
.foot{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:18px}

.title{font-size:clamp(48px,6vw,96px);line-height:.95;letter-spacing:-.02em}.title span{color:var(--amber)}

.count{font-family:'Space Grotesk';font-size:28px;font-weight:700}

.srow.first{background:var(--amber);color:var(--ink)}.srow.first .rank,.srow.first .gain{color:var(--ink)}
.podium{flex:1;display:flex;align-items:flex-end;justify-content:center;gap:24px}
.pod{width:min(26vw,300px);text-align:center;display:flex;flex-direction:column;align-items:center;gap:12px;opacity:0}
.pod.show{opacity:1;animation:fin .7s ease both}
.pod .name{font-family:'Space Grotesk';font-size:clamp(24px,2.6vw,40px);font-weight:700}.pod .s{font-size:22px;color:var(--muted)}
.pod .blk{width:100%;border-radius:16px 16px 0 0;display:grid;place-items:center;font-family:'Space Grotesk';font-size:80px;font-weight:700;color:var(--ink)}
.p1 .blk{height:40vh;background:var(--amber)}.p2 .blk{height:28vh;background:#D9D4C7}.p3 .blk{height:20vh;background:#C98B5B}
/* player (phone) */
.phone{flex:1;display:flex;flex-direction:column;gap:18px;max-width:520px;width:100%;margin:0 auto}
.phone .center{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:14px}
.field{width:100%;padding:16px 18px;border-radius:14px;border:0;font-size:22px;font-weight:700;text-align:center}
.pbar{display:flex;justify-content:space-between;align-items:center;font-weight:700}
.pgrid{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:12px;min-height:60vh}

.pgrid button .l{font-family:'Space Grotesk';font-size:56px;line-height:1}
.pgrid button.C{color:var(--ink)}
.big{font-family:'Space Grotesk';font-size:44px;font-weight:700;line-height:1.05}
.res{width:100%;border-radius:20px;padding:30px 20px}
.res.ok{background:var(--d)}.res.no{background:var(--a)}.res.none{background:var(--ink2)}
.spin{width:44px;height:44px;border-radius:50%;border:5px solid rgba(255,255,255,.15);border-top-color:var(--amber);animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.err{color:#FF8A70;font-weight:700;min-height:1.3em}
.setup{max-width:780px;margin:auto;display:flex;flex-direction:column;gap:14px;line-height:1.5}

const SECS=20, L="ABCD", COL=["#E4572E","#2F7DD1","#E8A317","#2E9E6A"];

/* ---------------- database layer ---------------- */
async function makeDB(){
  if(firebaseConfig){
    const {initializeApp}=await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js");
    const F=await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js");
    const db=F.getDatabase(initializeApp(firebaseConfig));let off=0;
    F.onValue(F.ref(db,".info/serverTimeOffset"),s=>{off=s.val()||0;});
    return {mode:"live",
      set:(p,v)=>F.set(F.ref(db,p),v),
      update:(p,v)=>F.update(F.ref(db,p),v),
      get:async p=>(await F.get(F.ref(db,p))).val(),
      on:(p,cb)=>F.onValue(F.ref(db,p),s=>cb(s.val())),
      stamp:()=>F.serverTimestamp(),
      now:()=>Date.now()+off};
  }
  // DEMO: shared through localStorage + BroadcastChannel (same browser only)
  const K="i2quiz-demo",bc=("BroadcastChannel" in window)?new BroadcastChannel(K):null,subs=new Set();
  const load=()=>{try{return JSON.parse(localStorage.getItem(K))||{};}catch(e){return {};}};
  const at=(o,p)=>p.split("/").filter(Boolean).reduce((x,k)=>x==null?x:x[k],o);
  const fix=v=>{if(v&&typeof v==="object"){if(v[".sv"])return Date.now();const o=Array.isArray(v)?[]:{};for(const k in v)o[k]=fix(v[k]);return o;}return v;};
  const put=(o,p,v)=>{const ks=p.split("/").filter(Boolean);let x=o;ks.slice(0,-1).forEach(k=>{if(typeof x[k]!=="object"||x[k]===null)x[k]={};x=x[k];});if(v===null)delete x[ks.at(-1)];else x[ks.at(-1)]=v;};
  const notify=()=>{const t=load();subs.forEach(s=>s.cb(at(t,s.p)??null));};
  const save=t=>{try{localStorage.setItem(K,JSON.stringify(t));}catch(e){}bc&&bc.postMessage(1);notify();};
  bc&&(bc.onmessage=notify);addEventListener("storage",e=>{if(e.key===K)notify();});
  return {mode:"demo",
    set:async(p,v)=>{const t=load();put(t,p,fix(v));save(t);},
    update:async(p,o)=>{const t=load();for(const k in o)put(t,p+"/"+k,fix(o[k]));save(t);},
    get:async p=>at(load(),p)??null,
    on:(p,cb)=>{const s={p,cb};subs.add(s);setTimeout(()=>cb(at(load(),p)??null));return ()=>subs.delete(s);},
    stamp:()=>({".sv":"timestamp"}),
    now:()=>Date.now()};
}

let db=null;
/* ---------------- helpers ---------------- */
const app=document.getElementById("app");
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const params=new URLSearchParams(location.search);
const joinURL=pin=>location.origin+location.pathname+"?pin="+pin;
const rid=()=>Math.random().toString(36).slice(2,10);
const points=(ms,secs)=>Math.round(1000*(1-Math.min(1,Math.max(0,ms/(secs*1000)))/2));
function qrSVG(text){try{const q=qrcode(0,"M");q.addData(text);q.make();return q.createSvgTag({cellSize:8,margin:2,scalable:true});}catch(e){return "";}}

/* sound + confetti (host only) */
let ac=null,muted=false,music=null;
function audio(){if(!ac){try{ac=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}if(ac&&ac.state==="suspended")ac.resume().catch(()=>{});return ac;}
function tone(f,d=.15,type="sine",v=.18,when=0){const a=audio();if(!a||muted)return;const t=a.currentTime+when,o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.setValueAtTime(f,t);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g).connect(a.destination);o.start(t);o.stop(t+d+.05);}
const sfx={blip:()=>tone(660,.12,"square",.12),go:()=>{tone(523,.12,"square",.14);tone(784,.25,"square",.14,.12);},tick:()=>tone(1200,.05,"square",.08),tickLow:()=>tone(880,.09,"square",.14),up:()=>{tone(220,.5,"sawtooth",.15);tone(165,.6,"sawtooth",.12,.08);},reveal:()=>[523,659,784,1047].forEach((f,k)=>tone(f,.28,"triangle",.16,k*.08)),ding:()=>tone(988,.18,"triangle",.12),fanfare:()=>[523,523,523,659,784,659,784,1047].forEach((f,k)=>tone(f,.3,"triangle",.17,k*.14))};
function startMusic(){stopMusic();if(muted||!ac)return;const s=[262,330,392,494,440,392,330,294];let k=0;music=setInterval(()=>{tone(s[k%8],.22,"triangle",.05);if(k%4===0)tone(s[k%8]/2,.4,"sine",.06);k++;},260);}
function stopMusic(){clearInterval(music);music=null;}
const cv=document.getElementById("confetti"),cx=cv.getContext("2d");let parts=[],raf=null;
function confetti(n=220){cv.width=innerWidth;cv.height=innerHeight;const c=["#E4572E","#2F7DD1","#E8A317","#2E9E6A","#FFB547","#8E5BD6"];for(let k=0;k<n;k++)parts.push({x:Math.random()*cv.width,y:-20-Math.random()*cv.height*.5,vx:(Math.random()-.5)*4,vy:2+Math.random()*4,r:Math.random()*6.28,vr:(Math.random()-.5)*.3,s:6+Math.random()*8,c:c[k%6]});if(!raf)loop();}
function loop(){cx.clearRect(0,0,cv.width,cv.height);parts=parts.filter(p=>p.y<cv.height+30);parts.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.03;p.r+=p.vr;cx.save();cx.translate(p.x,p.y);cx.rotate(p.r);cx.fillStyle=p.c;cx.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);cx.restore();});raf=parts.length?requestAnimationFrame(loop):null;}

/* ======================= HOST ======================= */
async function host(){
  document.getElementById("hud").hidden=false;
  document.getElementById("mute").onclick=()=>{muted=!muted;document.getElementById("mute").textContent=muted?"🔇 Muted":"🔊 Sound";muted?stopMusic():(H.phase==="lobby"&&startMusic());};
  document.getElementById("fs").onclick=()=>{try{document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen().catch(()=>{});}catch(e){}};
  const pin=String(Math.floor(100000+Math.random()*900000)), G="games/"+pin;
  const H={phase:"lobby",q:-1,players:{},answers:{},startedAt:0,timer:null,unA:null,last:{}};
  await db.set(G,{state:{phase:"lobby",q:-1,secs:SECS,created:db.stamp()}});
  db.on(G+"/players",v=>{H.players=v||{};if(H.phase==="lobby")renderLobby();if(H.phase==="question")updateAnswered();});
  const setState=s=>db.set(G+"/state",Object.assign({secs:SECS},s));
  const nPlayers=()=>Object.keys(H.players).length;
  const ranked=()=>Object.entries(H.players).sort((a,b)=>(b[1].score||0)-(a[1].score||0));

  function renderLobby(){
    const url=joinURL(pin),ps=Object.values(H.players);
    app.innerHTML=`<div class="top"><div class="kicker">Prisma Khas · New Hire Training${db.mode==="demo"?" · DEMO MODE":""}</div></div>
    <div class="lobby"><div class="joinbox">${qrSVG(url)}<div class="hint" style="color:#4A5266">Scan to join, or go to the link and enter</div><div class="pin">${pin}</div><div class="url">${esc(url)}</div></div>
    <div><h1 class="title">i2 ANB<br><span>Quiz Show</span></h1>
      <div class="count" style="margin-top:24px">${ps.length} player${ps.length===1?"":"s"} joined</div>
      <div class="players">${ps.map(p=>`<span class="pl">${esc(p.name)}</span>`).join("")||`<span class="hint">Waiting for players…</span>`}</div>
      <div class="foot" style="justify-content:flex-start"><button class="btn" id="start" type="button" ${ps.length?"":"disabled"}>Start game ▶</button><span class="hint">${Q.length} questions · ${SECS}s each · faster correct answers score more</span></div></div></div>`;
    document.getElementById("start").onclick=()=>{audio();stopMusic();ask(0);};
  }
  function ask(i){
    H.phase="ready";H.q=i;H.answers={};clearInterval(H.timer);H.unA&&H.unA();
    setState({phase:"ready",q:i});
    let n=3;const show=()=>{app.innerHTML=`<div class="top"><div class="kicker">Question ${i+1} of ${Q.length}</div></div><div class="qcard solo fade-in">${esc(Q[i][0])}</div><div class="hint" style="text-align:center;font-size:20px">Answers in ${n}…</div>`;};
    show();sfx.blip();
    H.timer=setInterval(()=>{n--;if(n>0){show();sfx.blip();}else{clearInterval(H.timer);open(i);}},1000);
  }
  async function open(i){
    sfx.go();H.phase="question";
    await setState({phase:"question",q:i,startedAt:db.stamp()});
    const st=await db.get(G+"/state");H.startedAt=st&&st.startedAt||db.now();
    H.unA=db.on(G+"/answers/"+i,v=>{H.answers=v||{};updateAnswered();});
    const [q,ans]=Q[i];
    app.innerHTML=`<div class="top"><div class="kicker">Question ${i+1} of ${Q.length}</div></div>
     <div class="qcard">${esc(q)}</div>
     <div class="mid"><div class="timer" id="tm"><span id="tn">${SECS}</span></div>
       <div class="answered"><b id="na">0</b><span class="hint">answers</span></div>
       <button class="btn ghost" id="skip" type="button">Skip timer</button></div>
     <div class="answers" id="ans">${ans.map((a,k)=>`<div class="ans ${L[k]}"><span class="l">${L[k]}</span><span>${esc(a)}</span><span class="n" id="n${k}">0</span></div>`).join("")}</div>`;
    document.getElementById("skip").onclick=reveal;
    let lastLeft=SECS;
    H.timer=setInterval(()=>{const left=Math.max(0,Math.ceil(SECS-(db.now()-H.startedAt)/1000));
      const tn=document.getElementById("tn"),tm=document.getElementById("tm");if(!tn)return;
      tn.textContent=left;tm.style.setProperty("--p",(left/SECS*100)+"%");tm.classList.toggle("low",left<=5);
      if(left!==lastLeft){lastLeft=left;left<=5?sfx.tickLow():sfx.tick();}
      if(left<=0){sfx.up();reveal();}},250);
  }
  function updateAnswered(){const el=document.getElementById("na");if(!el)return;const n=Object.keys(H.answers).length;el.textContent=n;
    if(H.phase==="question"&&n>0&&n>=nPlayers())setTimeout(()=>{if(H.phase==="question")reveal();},600);}
  async function reveal(){
    if(H.phase!=="question")return;H.phase="reveal";clearInterval(H.timer);H.unA&&H.unA();
    const i=H.q,ok=Q[i][2],ans=await db.get(G+"/answers/"+i)||{};H.answers=ans;
    const counts=[0,0,0,0],upd={};H.last={};
    for(const [pid,p] of Object.entries(H.players)){
      const a=ans[pid];let pts=0,res="none";
      if(a){counts[a.a]=(counts[a.a]||0)+1;if(a.a===ok){pts=points(a.t-H.startedAt,SECS);res="ok";}else res="no";}
      const streak=res==="ok"?(p.streak||0)+1:0;
      upd[pid+"/score"]=(p.score||0)+pts;upd[pid+"/streak"]=streak;upd[pid+"/last"]={q:i,res,pts};H.last[pid]=pts;
    }
    if(Object.keys(upd).length)await db.update(G+"/players",upd);
    await setState({phase:"reveal",q:i,counts});
    sfx.reveal();
    const max=Math.max(1,...counts);
    app.innerHTML=`<div class="top"><div class="kicker">Question ${i+1} of ${Q.length}</div></div>
     <div class="qcard">${esc(Q[i][0])}</div>
     <div class="dist">${counts.map((c,k)=>`<div style="background:${COL[k]};height:${44+c/max*100}px;${k===ok?"outline:4px solid var(--paper)":""}">${c}</div>`).join("")}</div>
     <div class="answers revealed">${Q[i][1].map((a,k)=>`<div class="ans ${L[k]} ${k===ok?"ok":""}"><span class="l">${L[k]}</span><span>${esc(a)}</span><span class="n">${k===ok?"✓":""}</span></div>`).join("")}</div>
     <div class="foot"><span class="hint">Correct answer: <b style="color:var(--paper)">${L[ok]}</b></span><button class="btn" id="nx" type="button">Scoreboard →</button></div>`;
    document.getElementById("nx").onclick=board;
  }
  function board(){
    H.phase="board";const last=H.q===Q.length-1;setState({phase:"board",q:H.q});
    const r=ranked().slice(0,6);
    app.innerHTML=`<div class="top"><div class="kicker">Scoreboard · after question ${H.q+1}</div></div>
     <div class="board">${r.map(([pid,p],k)=>`<div class="srow ${k===0?"first":""} fade-in" style="animation-delay:${k*.08}s"><span class="rank">${k+1}</span><span class="nm">${esc(p.name)}${(p.streak||0)>=3?" 🔥":""}</span>${H.last[pid]?`<span class="gain">+${H.last[pid]}</span>`:""}<span class="pts">${p.score||0}</span></div>`).join("")}</div>
     <div class="foot"><span class="hint">${nPlayers()} players</span><button class="btn" id="nx" type="button">${last?"And the winner is… 🏆":"Next question ▶"}</button></div>`;
    document.getElementById("nx").onclick=()=>last?podium():ask(H.q+1);
  }
  function podium(){
    H.phase="end";setState({phase:"end",q:H.q});
    const r=ranked(),slot=(k,c)=>r[k]?`<div class="pod ${c}" id="pod${k}"><div class="name">${esc(r[k][1].name)}</div><div class="s">${r[k][1].score||0} pts</div><div class="blk">${k+1}</div></div>`:"";
    app.innerHTML=`<div class="top"><div class="kicker">Final results</div></div><div class="podium">${slot(1,"p2")}${slot(0,"p1")}${slot(2,"p3")}</div>`;
    const show=k=>{const el=document.getElementById("pod"+k);if(el){el.classList.add("show");sfx.ding();}};
    setTimeout(()=>show(2),600);setTimeout(()=>show(1),1900);setTimeout(()=>{show(0);sfx.fanfare();confetti();setTimeout(()=>confetti(160),1400);},3600);
  }
  document.addEventListener("keydown",e=>{if(e.target.tagName==="INPUT")return;const k=e.key.toLowerCase();
    if(k==="f")document.getElementById("fs").click();if(k==="m")document.getElementById("mute").click();
    if(e.code==="Space"){e.preventDefault();const b=document.getElementById("nx")||document.getElementById("start")||document.getElementById("skip");b&&!b.disabled&&b.click();}});
  renderLobby();
  document.addEventListener("click",()=>{if(H.phase==="lobby"&&!music){audio();startMusic();}},{once:true});
}

/* ======================= PLAYER ======================= */
async function player(){
  let pin=(params.get("pin")||"").replace(/\D/g,"").slice(0,6);
  const key=p=>"i2quiz-pid-"+p;
  const saved=pin&&(()=>{try{return JSON.parse(sessionStorage.getItem(key(pin)));}catch(e){return null;}})();
  if(saved&&saved.id){return play(pin,saved.id,saved.name);}
  app.innerHTML=`<div class="phone"><div class="center">
    <div class="kicker">Prisma Khas</div><h1 class="big">i2 ANB<br>Quiz Show</h1>
    <input class="field" id="pin" inputmode="numeric" maxlength="6" placeholder="Game PIN" value="${esc(pin)}">
    <input class="field" id="nm" maxlength="16" placeholder="Your nickname" autocomplete="off">
    <div class="err" id="err"></div>
    <button class="btn" id="go" type="button" style="width:100%">Join ▶</button>
    <div class="hint">Hosting the game? <a href="?host" style="color:var(--amber)">Open host screen</a></div></div></div>`;
  const go=async()=>{
    const p=document.getElementById("pin").value.replace(/\D/g,""),n=document.getElementById("nm").value.trim().slice(0,16),err=document.getElementById("err");
    if(p.length!==6){err.textContent="Enter the 6-digit PIN on the screen.";return;}
    if(!n){err.textContent="Pick a nickname.";return;}
    err.textContent="Joining…";
    const st=await db.get("games/"+p+"/state");
    if(!st){err.textContent="No game with that PIN.";return;}
    if(st.phase==="end"){err.textContent="That game has finished.";return;}
    const id=rid();await db.set("games/"+p+"/players/"+id,{name:n,score:0,streak:0,joined:db.stamp()});
    try{sessionStorage.setItem(key(p),JSON.stringify({id,name:n}));}catch(e){}
    history.replaceState(null,"","?pin="+p);play(p,id,n);
  };
  document.getElementById("go").onclick=go;
  document.getElementById("nm").onkeydown=e=>{if(e.key==="Enter")go();};
}
function play(pin,id,name){
  const G="games/"+pin;let st=null,me=null,all={},picked={};
  const rank=()=>{const r=Object.entries(all).sort((a,b)=>(b[1].score||0)-(a[1].score||0));return r.findIndex(x=>x[0]===id)+1;};
  const head=()=>`<div class="pbar"><span>${esc(name)}</span><span>${me?me.score||0:0} pts</span></div>`;
  function render(){
    if(!st){app.innerHTML=`<div class="phone"><div class="center"><div class="spin"></div></div></div>`;return;}
    if(!me){app.innerHTML=`<div class="phone"><div class="center"><h2 class="big">You were removed</h2><button class="btn" id="re" type="button">Join again</button></div></div>`;document.getElementById("re").onclick=()=>{try{sessionStorage.removeItem("i2quiz-pid-"+pin);}catch(e){}location.reload();};return;}
    const i=st.q;let body="";
    if(st.phase==="lobby")body=`<div class="center"><div class="kicker">You're in!</div><h2 class="big">See your name<br>on the screen?</h2><div class="hint">Waiting for the host to start…</div></div>`;
    else if(st.phase==="ready")body=`<div class="center"><div class="kicker">Question ${i+1} of ${Q.length}</div><h2 class="big">Get ready…</h2><div class="hint">Read the question on the big screen</div><div class="spin"></div></div>`;
    else if(st.phase==="question"){
      if(picked[i]!==undefined)body=`<div class="center"><h2 class="big">Locked in!</h2><div class="res none"><span style="font-family:'Space Grotesk';font-size:64px">${L[picked[i]]}</span></div><div class="hint">Waiting for everyone else…</div></div>`;
      else body=`<div class="kicker" style="text-align:center">Question ${i+1} of ${Q.length}</div><div class="pgrid">${Q[i][1].map((a,k)=>`<button type="button" class="${L[k]}" data-k="${k}"><span class="l">${L[k]}</span><span>${esc(a)}</span></button>`).join("")}</div>`;
    }
    else if(st.phase==="reveal"){
      const l=me.last&&me.last.q===i?me.last:{res:"none",pts:0};
      body=`<div class="center"><div class="res ${l.res}"><h2 class="big">${l.res==="ok"?"Correct! ✓":l.res==="no"?"Not quite ✗":"Time's up"}</h2>${l.res==="ok"?`<div style="font-size:28px;font-weight:800;margin-top:8px">+${l.pts}</div>`:""}${(me.streak||0)>=2?`<div style="margin-top:8px;font-weight:700">🔥 Streak ${me.streak}</div>`:""}</div><div class="hint">Answer: ${L[Q[i][2]]} · ${esc(Q[i][1][Q[i][2]])}</div></div>`;
    }
    else if(st.phase==="board")body=`<div class="center"><div class="kicker">Scoreboard</div><h2 class="big">You're #${rank()}</h2><div style="font-size:24px;font-weight:800">${me.score||0} pts</div><div class="hint">Look at the screen</div></div>`;
    else if(st.phase==="end"){const r=rank();body=`<div class="center"><div class="kicker">Game over</div><h2 class="big">${r===1?"🏆 You won!":r<=3?"🥈 Podium! #"+r:"You finished #"+r}</h2><div style="font-size:24px;font-weight:800">${me.score||0} pts</div><div class="hint">Thanks for playing!</div></div>`;}
    app.innerHTML=`<div class="phone">${head()}${body}</div>`;
    app.querySelectorAll(".pgrid button").forEach(b=>b.onclick=()=>{const k=+b.dataset.k;picked[i]=k;render();if(navigator.vibrate)try{navigator.vibrate(40);}catch(e){}
      db.set(G+"/answers/"+i+"/"+id,{a:k,t:db.stamp()});});
  }
  db.on(G+"/state",v=>{st=v;render();});
  db.on(G+"/players",v=>{all=v||{};me=all[id]||null;render();});
  render();
}

/* ======================= BOOT ======================= */
(async()=>{
  try{db=await makeDB();}catch(e){app.innerHTML=`<div class="setup"><h2>Could not connect</h2><p>Check the Firebase config and that the Realtime Database exists.</p><p class="hint">${esc(e.message)}</p></div>`;return;}
  params.has("host")?host():player();
})();
